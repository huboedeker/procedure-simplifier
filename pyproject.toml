[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "procedure-simplifier"
version = "0.8.0"
description = "Auditable, agent-operated simplification of procedural documents"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Procedure Simplifier contributors"}]
dependencies = []
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]

[project.optional-dependencies]
dev = ["build>=1.2", "jsonschema>=4.19"]

[project.scripts]
procedure-simplifier = "procedure_simplifier.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["procedure_simplifier*"]

[tool.setuptools.package-data]
procedure_simplifier = ["framework/**/*", "framework/*"]
